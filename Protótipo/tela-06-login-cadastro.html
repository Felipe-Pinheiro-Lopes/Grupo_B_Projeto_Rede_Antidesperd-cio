<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar ou Cadastrar — Rede Antidesperdício</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center py-12 px-6">

  <div class="max-w-md w-full mx-auto">
    <div class="text-center mb-8">
      <a href="tela-01-landing-page.html" class="inline-block text-4xl p-3 bg-emerald-100 rounded-3xl mb-3">🌿</a>
      <h1 class="text-3xl font-extrabold text-slate-900">Acesse a Rede</h1>
      <p class="text-slate-500 text-sm mt-1">Conectando excedente de alimentos à solidariedade</p>
    </div>

    <!-- SELETOR DUAL DE PERFIL -->
    <div class="grid grid-cols-2 gap-3 mb-6 bg-slate-200/60 p-1.5 rounded-2xl">
      <button class="bg-white text-emerald-800 font-bold py-2.5 rounded-xl text-xs shadow-sm flex items-center justify-center gap-1.5 border border-slate-200">
        🍎 Quero Doar
      </button>
      <button class="text-slate-600 hover:text-slate-900 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">
        🤝 Sou ONG / Cozinha
      </button>
    </div>

    <!-- FORMULÁRIO -->
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
      <form class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome do Estabelecimento ou Barraca</label>
          <input type="text" placeholder="Ex: Barraca do Zé (Feira Livre)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">WhatsApp para Contato</label>
          <input type="tel" placeholder="(11) 98765-4321" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Endereço Principal ou Ponto de Feira</label>
          <input type="text" placeholder="Ex: Feira de Domingo - Rua França Pinto" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="flex items-start gap-2 pt-2">
          <input type="checkbox" id="terms" checked class="mt-1 rounded text-emerald-600 focus:ring-emerald-500">
          <label for="terms" class="text-xs text-slate-500 leading-snug">
            Declaro doar alimentos de acordo com as diretrizes sanitárias da <strong class="text-slate-700">Lei Federal 14.016/2020</strong>.
          </label>
        </div>

        <div class="pt-2">
          <a href="tela-08-painel-doador.html" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-center shadow-lg shadow-emerald-600/20 transition text-sm">
            Entrar no Painel do Doador →
          </a>
        </div>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      <a href="tela-01-landing-page.html" class="hover:underline">← Voltar para a Página Inicial</a>
    </p>
  </div>

</body>
</html>
