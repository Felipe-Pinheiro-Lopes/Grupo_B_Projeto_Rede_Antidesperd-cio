<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Feiras e Resgates — Rede Antidesperdício</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
    .map-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between overflow-hidden">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm z-20">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="tela-01-landing-page.html" class="text-2xl p-2 bg-emerald-100 rounded-xl block">📍</a>
        <div>
          <span class="font-extrabold text-xl text-slate-900 block leading-tight">Mapa de Resgates</span>
          <span class="text-xs font-semibold text-emerald-600 uppercase tracking-widest">Geolocalização em Tempo Real</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <select class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700">
          <option>Raio: 5 km</option>
          <option>Raio: 3 km</option>
          <option>Raio: 10 km</option>
        </select>
        <a href="tela-02-feed-doacoes.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-3 py-2 rounded-xl transition">
          Ver Lista
        </a>
      </div>
    </div>
  </header>

  <!-- MAPA VIRTUAL SIMULADO -->
  <main class="flex-grow relative map-grid bg-emerald-50/40 flex items-center justify-center overflow-hidden">
    <!-- ESTRUTURA DO MAPA COM PINS INTERATIVOS -->
    <div class="absolute inset-0 flex items-center justify-center">

      <!-- PIN 1 (DISPONÍVEL) -->
      <button onclick="selectPin('Feira Vila Mariana', 'Barraca do Seu Zé • 25kg de Tomates', 'Hoje até 14:15')" class="absolute top-1/3 left-1/3 group -translate-x-1/2 -translate-y-1/2 focus:outline-none">
        <div class="relative flex items-center justify-center">
          <span class="animate-ping absolute inline-flex h-8 w-8 rounded-full bg-emerald-400 opacity-75"></span>
          <div class="w-10 h-10 bg-emerald-600 text-white rounded-full flex items-center justify-center text-lg shadow-lg border-2 border-white group-hover:scale-110 transition">
            🍎
          </div>
        </div>
        <span class="bg-white/90 backdrop-blur-sm text-[11px] font-bold text-emerald-950 px-2.5 py-1 rounded-full shadow border border-emerald-100 block mt-1 whitespace-nowrap">
          Feira Vila Mariana (25kg)
        </span>
      </button>

      <!-- PIN 2 (PADARIA) -->
      <button onclick="selectPin('Padaria Estrela do Bairro', '18kg de Pães e Broas', 'Hoje até 16:00')" class="absolute top-1/2 right-1/3 group -translate-x-1/2 -translate-y-1/2 focus:outline-none">
        <div class="w-10 h-10 bg-amber-500 text-white rounded-full flex items-center justify-center text-lg shadow-lg border-2 border-white group-hover:scale-110 transition">
          🍞
        </div>
        <span class="bg-white/90 backdrop-blur-sm text-[11px] font-bold text-slate-800 px-2.5 py-1 rounded-full shadow border border-slate-200 block mt-1 whitespace-nowrap">
          Bela Vista (18kg)
        </span>
      </button>

      <!-- PIN 3 (RESTAURANTE) -->
      <button onclick="selectPin('Restaurante Sabor da Terra', '35 marmitas prontas', 'Hoje até 14:00 (Urgente)')" class="absolute bottom-1/3 left-1/2 group -translate-x-1/2 -translate-y-1/2 focus:outline-none">
        <div class="relative flex items-center justify-center">
          <span class="animate-ping absolute inline-flex h-8 w-8 rounded-full bg-red-400 opacity-75"></span>
          <div class="w-10 h-10 bg-red-500 text-white rounded-full flex items-center justify-center text-lg shadow-lg border-2 border-white group-hover:scale-110 transition">
            🍲
          </div>
        </div>
        <span class="bg-white/90 backdrop-blur-sm text-[11px] font-bold text-red-700 px-2.5 py-1 rounded-full shadow border border-red-100 block mt-1 whitespace-nowrap">
          Paraíso (35 un • Urgente)
        </span>
      </button>

    </div>

    <!-- BOTTOM SHEET DE PRÉVIA DO PONTO CLICADO -->
    <div id="bottomSheet" class="absolute bottom-6 left-6 right-6 max-w-lg mx-auto bg-white p-5 rounded-3xl border border-slate-200 shadow-2xl z-30 flex items-center justify-between gap-4">
      <div>
        <span class="text-[10px] font-black uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">Ponto Selecionado</span>
        <h3 id="pinTitle" class="font-extrabold text-slate-900 text-sm mt-1">Feira Vila Mariana (Rua França Pinto)</h3>
        <p id="pinDesc" class="text-xs text-slate-500">Barraca do Seu Zé • 25kg de Tomates e Folhagens</p>
        <span id="pinTime" class="text-xs text-red-600 font-bold block mt-0.5">Tolerância: Hoje até 14:15</span>
      </div>
      <a href="tela-04-detalhes-lote.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-3 rounded-xl shadow-md transition whitespace-nowrap">
        Ver Detalhes →
      </a>
    </div>
  </main>

  <script>
    function selectPin(title, desc, time) {
      document.getElementById('pinTitle').innerText = title;
      document.getElementById('pinDesc').innerText = desc;
      document.getElementById('pinTime').innerText = "Tolerância: " + time;
    }
  </script>

</body>
</html>
